  <script>
    (function () {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;

      const isIOS =
        /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      let lockedWidth = window.innerWidth;
      let stableCanvasHeight = getVisibleHeight();
      let keyboardHoldUntil = 0;
      let lastHeightApplyTime = 0;

      function getVisibleHeight() {
        if (window.visualViewport && window.visualViewport.height > 0) {
          return Math.round(window.visualViewport.height);
        }

        return Math.round(window.innerHeight);
      }

      function isTextInputElement(el) {
        if (!el || !el.tagName) return false;

        const tag = el.tagName.toLowerCase();
        if (tag !== "input" && tag !== "textarea") return false;

        const type = (el.getAttribute("type") || "").toLowerCase();

        return !(
          type === "hidden" ||
          type === "checkbox" ||
          type === "radio" ||
          type === "file" ||
          type === "submit" ||
          type === "button"
        );
      }

      function hasVisibleTextInput() {
        if (isTextInputElement(document.activeElement)) return true;

        const inputs = document.querySelectorAll("input, textarea");

        for (const input of inputs) {
          if (!isTextInputElement(input)) continue;

          const style = window.getComputedStyle(input);
          if (style.display === "none" || style.visibility === "hidden") continue;

          const rect = input.getBoundingClientRect();

          // Unity's input can briefly report 0 size while it is being rebuilt,
          // so do not rely only on rect size. Existing visible text input means
          // the keyboard session is still active or transitioning.
          if (rect.width > 0 || rect.height > 0 || document.body.contains(input)) {
            return true;
          }
        }

        return false;
      }

      function getKeyboardHeightEstimate() {
        if (!window.visualViewport) return 0;

        return Math.max(
          0,
          window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop
        );
      }

      function looksLikeKeyboardOpen(currentHeight) {
        if (hasVisibleTextInput()) return true;

        if (Date.now() < keyboardHoldUntil) return true;

        if (isIOS) {
          // iOS Safari/Chrome/PWA reports keyboard mainly by shrinking visualViewport.
          // Keep the canvas locked if the current visible height is clearly smaller
          // than the last good non-keyboard height.
          return stableCanvasHeight > 0 && currentHeight < stableCanvasHeight - 70;
        }

        return getKeyboardHeightEstimate() > 80;
      }

      function applyUnityHeight(height) {
        height = Math.round(height);

        if (!height || height < 100) return;

        lastHeightApplyTime = Date.now();

        document.documentElement.style.setProperty(
          "--unity-visible-height",
          height + "px"
        );

        document.documentElement.style.margin = "0";
        document.documentElement.style.padding = "0";
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = height + "px";
        document.documentElement.style.overflow = "hidden";
        document.documentElement.style.position = "fixed";
        document.documentElement.style.left = "0";
        document.documentElement.style.top = "0";

        document.body.style.margin = "0";
        document.body.style.padding = "0";
        document.body.style.width = "100%";
        document.body.style.height = height + "px";
        document.body.style.overflow = "hidden";
        document.body.style.position = "fixed";
        document.body.style.left = "0";
        document.body.style.top = "0";

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");

        if (container) {
          container.style.position = "fixed";
          container.style.left = "0";
          container.style.top = "0";
          container.style.right = "0";
          container.style.bottom = "auto";
          container.style.width = "100vw";
          container.style.height = height + "px";
          container.style.overflow = "hidden";
          container.style.transform = "translateY(0px)";
        }

        if (canvas) {
          canvas.style.width = "100vw";
          canvas.style.height = height + "px";
        }

        window.scrollTo(0, 0);
      }

      function updateUnityCanvasHeight() {
        const currentWidth = window.innerWidth;
        const currentHeight = getVisibleHeight();

        const orientationChanged = Math.abs(currentWidth - lockedWidth) > 80;

        if (orientationChanged) {
          lockedWidth = currentWidth;
          keyboardHoldUntil = 0;

          setTimeout(function () {
            stableCanvasHeight = getVisibleHeight();
            applyUnityHeight(stableCanvasHeight);
          }, 500);

          return;
        }

        if (looksLikeKeyboardOpen(currentHeight)) {
          // Never allow iOS keyboard open/focus-switch transitions to shrink canvas.
          applyUnityHeight(stableCanvasHeight);
          return;
        }

        // Accept new height only when it looks like a real non-keyboard viewport.
        // This prevents the iOS Chrome "canvas stays shrunk after blur/switch" case.
        if (isIOS) {
          if (currentHeight >= stableCanvasHeight - 20) {
            stableCanvasHeight = Math.max(stableCanvasHeight, currentHeight);
          }
        } else {
          stableCanvasHeight = currentHeight;
        }

        applyUnityHeight(stableCanvasHeight);
      }

      function holdKeyboardSession(duration) {
        keyboardHoldUntil = Math.max(keyboardHoldUntil, Date.now() + duration);
      }

      window.addEventListener("load", function () {
        lockedWidth = window.innerWidth;
        stableCanvasHeight = getVisibleHeight();
        applyUnityHeight(stableCanvasHeight);

        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 500);
      });

      window.addEventListener("resize", function () {
        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 300);
      });

      window.addEventListener("orientationchange", function () {
        keyboardHoldUntil = 0;

        setTimeout(function () {
          lockedWidth = window.innerWidth;
          stableCanvasHeight = getVisibleHeight();
          applyUnityHeight(stableCanvasHeight);
        }, 600);
      });

      document.addEventListener("focusin", function (event) {
        if (isTextInputElement(event.target) || hasVisibleTextInput()) {
          holdKeyboardSession(2600);
        }

        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 300);
        setTimeout(updateUnityCanvasHeight, 700);
      }, true);

      document.addEventListener("focusout", function () {
        // During input-to-input switching iOS can briefly blur the old input.
        // Keep the canvas locked long enough for the next native input to appear.
        holdKeyboardSession(2600);

        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 250);
        setTimeout(updateUnityCanvasHeight, 700);

        setTimeout(function () {
          if (!hasVisibleTextInput()) {
            keyboardHoldUntil = 0;
          }

          updateUnityCanvasHeight();
        }, 2200);

        setTimeout(updateUnityCanvasHeight, 3000);
      }, true);

      document.addEventListener("touchstart", function (event) {
        if (isTextInputElement(event.target) || hasVisibleTextInput()) {
          holdKeyboardSession(2400);
          requestAnimationFrame(updateUnityCanvasHeight);
          setTimeout(updateUnityCanvasHeight, 300);
        }
      }, true);

      window.addEventListener(
        "scroll",
        function () {
          window.scrollTo(0, 0);
        },
        { passive: false }
      );

      document.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () {
          requestAnimationFrame(updateUnityCanvasHeight);
          setTimeout(updateUnityCanvasHeight, 120);
        });

        window.visualViewport.addEventListener("scroll", function () {
          requestAnimationFrame(updateUnityCanvasHeight);
          window.scrollTo(0, 0);
        });
      }

      const observer = new MutationObserver(function () {
        if (hasVisibleTextInput()) {
          holdKeyboardSession(2200);
          requestAnimationFrame(updateUnityCanvasHeight);
        }
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      updateUnityCanvasHeight();
    })();
  </script>
  <script>
    (function () {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;

      const isIOS =
        /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if ("virtualKeyboard" in navigator) {
        try {
          navigator.virtualKeyboard.overlaysContent = true;
        } catch (e) { }
      }

      let activeInput = null;
      let activeOkButton = null;
      let lastOkButton = null;
      let clearSessionTimer = null;
      let positionLoopTimer = null;
      let mutationDebounceTimer = null;
      let isApplyingStyles = false;

      const INPUT_BORDER_COLOR = "#39A3D0";
      const INPUT_BORDER_WIDTH = "1px";
      const INPUT_BORDER_STYLE = INPUT_BORDER_WIDTH + " solid " + INPUT_BORDER_COLOR;

      const INPUT_GAP = 8;
      const INPUT_HEIGHT = 42;
      const INPUT_LEFT = 12;
      const INPUT_RIGHT = 12;
      const OK_BUTTON_WIDTH = 64;

      // Android Chrome browser only.
      const CHROME_BROWSER_INPUT_EXTRA_LIFT = 20;

      // iOS Safari / iOS installed app can report keyboard height as 0.
      // The fallback is used only while a Unity/native text input exists.
      const IOS_FALLBACK_KEYBOARD_MIN = 260;
      const IOS_FALLBACK_KEYBOARD_MAX = 390;
      const IOS_FALLBACK_KEYBOARD_RATIO = 0.40;

      const KEYBOARD_OPEN_THRESHOLD = 80;

      let lastKeyboardHeight = 0;
      let lockedInputBottom = 0;
      let keyboardSessionUntil = 0;

      function isInstalledWebApp() {
        return (
          (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
          (window.matchMedia && window.matchMedia("(display-mode: minimal-ui)").matches) ||
          window.navigator.standalone === true ||
          (document.referrer && document.referrer.indexOf("android-app://") === 0)
        );
      }

      function isNormalChromeBrowser() {
        const ua = navigator.userAgent || "";

        const isAndroidChrome =
          /Android/i.test(ua) &&
          /Chrome\/\d+/i.test(ua) &&
          !/SamsungBrowser|EdgA|OPR|Firefox|FxiOS/i.test(ua);

        return isAndroidChrome && !isInstalledWebApp();
      }

      function isTextInput(el) {
        if (!el) return false;

        const tag = el.tagName ? el.tagName.toLowerCase() : "";
        if (tag !== "input" && tag !== "textarea") return false;

        const type = (el.getAttribute("type") || "").toLowerCase();

        return !(
          type === "hidden" ||
          type === "checkbox" ||
          type === "radio" ||
          type === "file" ||
          type === "submit" ||
          type === "button"
        );
      }

      function isVisibleCandidateInput(el) {
        if (!isTextInput(el)) return false;

        const style = window.getComputedStyle(el);
        if (style.display === "none" || style.visibility === "hidden") return false;

        return document.body.contains(el);
      }

      function findCandidateInput() {
        if (isVisibleCandidateInput(document.activeElement)) {
          return document.activeElement;
        }

        if (activeInput && isVisibleCandidateInput(activeInput)) {
          return activeInput;
        }

        const inputs = Array.from(document.querySelectorAll("input, textarea"))
          .filter(isVisibleCandidateInput);

        if (inputs.length <= 0) return null;

        // Unity usually appends/rebuilds the active native input last.
        return inputs[inputs.length - 1];
      }

      function hasTextInputSession() {
        return !!findCandidateInput() || Date.now() < keyboardSessionUntil;
      }

      function isPossibleOkButton(el) {
        if (!el) return false;

        const tag = el.tagName ? el.tagName.toLowerCase() : "";
        const text = (el.innerText || el.value || el.textContent || "").trim().toLowerCase();

        if (tag === "button" && (text === "ok" || text === "done" || text === "enter")) {
          return true;
        }

        if (tag === "input") {
          const type = (el.getAttribute("type") || "").toLowerCase();

          if (
            (type === "button" || type === "submit") &&
            (text === "ok" || text === "done" || text === "enter")
          ) {
            return true;
          }
        }

        return false;
      }

      function getRawKeyboardHeight() {
        let height = 0;

        if (!isIOS && "virtualKeyboard" in navigator && navigator.virtualKeyboard.boundingRect) {
          const rect = navigator.virtualKeyboard.boundingRect;

          if (rect && rect.height > 0) {
            height = rect.height;
          }
        }

        if (height <= 0 && window.visualViewport) {
          const viewport = window.visualViewport;

          height = Math.max(
            0,
            window.innerHeight - viewport.height - viewport.offsetTop
          );
        }

        return Math.round(height);
      }

      function getCSSUnityHeight() {
        const raw = window.getComputedStyle(document.documentElement)
          .getPropertyValue("--unity-visible-height");

        const parsed = parseFloat(raw);

        if (parsed && parsed > 0) return parsed;

        return 0;
      }

      function getIOSFallbackKeyboardHeight() {
        const baseHeight = Math.round(
          Math.max(
            getCSSUnityHeight(),
            window.innerHeight || 0,
            document.documentElement.clientHeight || 0,
            window.visualViewport ? window.visualViewport.height : 0
          )
        );

        const estimated = Math.round(baseHeight * IOS_FALLBACK_KEYBOARD_RATIO);

        return Math.max(
          IOS_FALLBACK_KEYBOARD_MIN,
          Math.min(IOS_FALLBACK_KEYBOARD_MAX, estimated)
        );
      }

      function getEffectiveKeyboardHeight() {
        let keyboardHeight = getRawKeyboardHeight();

        const candidateInput = findCandidateInput();

        if (candidateInput) {
          activeInput = candidateInput;
          keyboardSessionUntil = Math.max(keyboardSessionUntil, Date.now() + 2600);
        }

        // iOS Safari / iOS installed PWA can report 0 while keyboard is visible.
        // If a Unity input exists, use fallback so the input does not sit at the bottom.
        if (isIOS && hasTextInputSession() && keyboardHeight <= KEYBOARD_OPEN_THRESHOLD) {
          keyboardHeight = getIOSFallbackKeyboardHeight();
        }

        if (keyboardHeight > KEYBOARD_OPEN_THRESHOLD) {
          lastKeyboardHeight = Math.max(lastKeyboardHeight, keyboardHeight);
        }

        return keyboardHeight;
      }

      function getStableInputBottom() {
        const keyboardHeight = getEffectiveKeyboardHeight();

        const extraLift = !isIOS && isNormalChromeBrowser()
          ? CHROME_BROWSER_INPUT_EXTRA_LIFT
          : 0;

        const candidateBottom = Math.max(
          INPUT_GAP,
          keyboardHeight + INPUT_GAP + extraLift
        );

        const keyboardLooksOpen =
          keyboardHeight > KEYBOARD_OPEN_THRESHOLD ||
          lastKeyboardHeight > KEYBOARD_OPEN_THRESHOLD ||
          hasTextInputSession();

        if (keyboardLooksOpen) {
          lockedInputBottom = Math.max(
            lockedInputBottom,
            candidateBottom,
            lastKeyboardHeight + INPUT_GAP + extraLift
          );

          return lockedInputBottom;
        }

        return candidateBottom;
      }

      function resetKeyboardSessionIfClosed() {
        const rawKeyboardHeight = getRawKeyboardHeight();

        if (!findCandidateInput() && rawKeyboardHeight <= KEYBOARD_OPEN_THRESHOLD) {
          lastKeyboardHeight = 0;
          lockedInputBottom = 0;
          activeInput = null;
          activeOkButton = null;
          keyboardSessionUntil = 0;
        }
      }

      function findUnityOkButton(input) {
        if (!input) return null;

        const parent = input.parentElement;

        if (parent) {
          const nearby = parent.querySelectorAll("button, input[type='button'], input[type='submit']");

          for (const el of nearby) {
            if (isPossibleOkButton(el)) {
              lastOkButton = el;
              return el;
            }
          }
        }

        const allButtons = document.querySelectorAll("button, input[type='button'], input[type='submit']");

        for (const el of allButtons) {
          if (isPossibleOkButton(el)) {
            lastOkButton = el;
            return el;
          }
        }

        if (lastOkButton && document.body.contains(lastOkButton)) {
          return lastOkButton;
        }

        const inputRect = input.getBoundingClientRect();
        let bestButton = null;
        let bestDistance = Infinity;

        allButtons.forEach(function (btn) {
          if (!document.body.contains(btn)) return;

          const rect = btn.getBoundingClientRect();

          // Accept briefly hidden/rebuilt buttons too; Unity can show it after focus animation.
          const distance =
            Math.abs(rect.top - inputRect.top) +
            Math.abs(rect.left - inputRect.right);

          if (distance < bestDistance) {
            bestDistance = distance;
            bestButton = btn;
          }
        });

        if (bestButton) {
          lastOkButton = bestButton;
        }

        return bestButton;
      }

      function applyInputStyle(input, okWidth, bottom) {
        input.style.setProperty("position", "fixed", "important");
        input.style.setProperty("left", INPUT_LEFT + "px", "important");
        input.style.setProperty("right", (INPUT_RIGHT + okWidth) + "px", "important");
        input.style.setProperty("bottom", bottom + "px", "important");
        input.style.setProperty("top", "auto", "important");

        input.style.setProperty(
          "width",
          "calc(100vw - " + (INPUT_LEFT + INPUT_RIGHT + okWidth) + "px)",
          "important"
        );

        input.style.setProperty("height", INPUT_HEIGHT + "px", "important");
        input.style.setProperty("min-height", INPUT_HEIGHT + "px", "important");

        input.style.setProperty("z-index", "2147483646", "important");
        input.style.setProperty("display", "block", "important");
        input.style.setProperty("visibility", "visible", "important");
        input.style.setProperty("opacity", "1", "important");

        input.style.setProperty("font-size", "16px", "important");
        input.style.setProperty("line-height", INPUT_HEIGHT + "px", "important");
        input.style.setProperty("padding", "0 12px", "important");
        input.style.setProperty("box-sizing", "border-box", "important");

        input.style.setProperty("background", "#ffffff", "important");
        input.style.setProperty("color", "#000000", "important");
        input.style.setProperty("outline", "none", "important");
        input.style.setProperty("transform", "none", "important");
        input.style.setProperty("-webkit-transform", "none", "important");
      }

      function applyOkButtonStyle(button, bottom) {
        button.style.setProperty("position", "fixed", "important");
        button.style.setProperty("right", INPUT_RIGHT + "px", "important");
        button.style.setProperty("bottom", bottom + "px", "important");
        button.style.setProperty("top", "auto", "important");
        button.style.setProperty("left", "auto", "important");

        button.style.setProperty("width", OK_BUTTON_WIDTH + "px", "important");
        button.style.setProperty("height", INPUT_HEIGHT + "px", "important");
        button.style.setProperty("min-height", INPUT_HEIGHT + "px", "important");

        button.style.setProperty("z-index", "2147483647", "important");
        button.style.setProperty("display", "block", "important");
        button.style.setProperty("visibility", "visible", "important");
        button.style.setProperty("opacity", "1", "important");

        button.style.setProperty("font-size", "14px", "important");
        button.style.setProperty("line-height", INPUT_HEIGHT + "px", "important");
        button.style.setProperty("padding", "0", "important");
        button.style.setProperty("margin", "0", "important");
        button.style.setProperty("box-sizing", "border-box", "important");

        button.style.setProperty("background", "#ffffff", "important");
        button.style.setProperty("color", "#000000", "important");
        button.style.setProperty("border", INPUT_BORDER_STYLE, "important");
        button.style.setProperty("border-left", "1px solid " + INPUT_BORDER_COLOR, "important");
        button.style.setProperty("border-radius", "0 8px 8px 0", "important");
        button.style.setProperty("transform", "none", "important");
        button.style.setProperty("-webkit-transform", "none", "important");
      }

      function positionNativeInputAndUnityOkButton(input) {
        const targetInput = isTextInput(input) ? input : findCandidateInput();

        if (!targetInput) return;

        isApplyingStyles = true;

        activeInput = targetInput;
        keyboardSessionUntil = Math.max(keyboardSessionUntil, Date.now() + 2600);

        activeOkButton = findUnityOkButton(targetInput);

        const okWidth = activeOkButton ? OK_BUTTON_WIDTH : 0;
        const bottom = getStableInputBottom();

        applyInputStyle(targetInput, okWidth, bottom);

        if (activeOkButton) {
          applyOkButtonStyle(activeOkButton, bottom);

          targetInput.style.setProperty("border", INPUT_BORDER_STYLE, "important");
          targetInput.style.setProperty("border-right", "0", "important");
          targetInput.style.setProperty("border-radius", "8px 0 0 8px", "important");
        } else {
          targetInput.style.setProperty("border", INPUT_BORDER_STYLE, "important");
          targetInput.style.setProperty("border-radius", "8px", "important");
        }

        window.scrollTo(0, 0);

        setTimeout(function () {
          isApplyingStyles = false;
        }, 0);
      }

      function updatePosition() {
        const candidate = findCandidateInput();

        if (candidate) {
          positionNativeInputAndUnityOkButton(candidate);
          return;
        }

        if (activeInput && document.body.contains(activeInput)) {
          positionNativeInputAndUnityOkButton(activeInput);
        }
      }

      function startPositionLoop(input) {
        if (positionLoopTimer) {
          clearInterval(positionLoopTimer);
          positionLoopTimer = null;
        }

        const startedAt = Date.now();

        positionLoopTimer = setInterval(function () {
          const candidate = findCandidateInput() || input;

          if (candidate && document.body.contains(candidate)) {
            positionNativeInputAndUnityOkButton(candidate);
          }

          if (Date.now() - startedAt > 4200) {
            clearInterval(positionLoopTimer);
            positionLoopTimer = null;
          }
        }, 50);
      }

      function schedulePosition(input) {
        const target = isTextInput(input) ? input : findCandidateInput();

        if (!target) return;

        if (clearSessionTimer) {
          clearTimeout(clearSessionTimer);
          clearSessionTimer = null;
        }

        activeInput = target;
        keyboardSessionUntil = Math.max(keyboardSessionUntil, Date.now() + 3000);

        requestAnimationFrame(function () {
          positionNativeInputAndUnityOkButton(target);
        });

        setTimeout(function () {
          positionNativeInputAndUnityOkButton(target);
        }, 50);

        setTimeout(function () {
          positionNativeInputAndUnityOkButton(target);
        }, 150);

        setTimeout(function () {
          positionNativeInputAndUnityOkButton(target);
        }, 300);

        setTimeout(function () {
          positionNativeInputAndUnityOkButton(target);
        }, 650);

        setTimeout(function () {
          positionNativeInputAndUnityOkButton(findCandidateInput() || target);
        }, 1100);

        startPositionLoop(target);
      }

      function scheduleByScan() {
        const candidate = findCandidateInput();

        if (candidate) {
          schedulePosition(candidate);
        }
      }

      document.addEventListener(
        "focusin",
        function (event) {
          if (isTextInput(event.target)) {
            schedulePosition(event.target);
          } else {
            setTimeout(scheduleByScan, 50);
            setTimeout(scheduleByScan, 200);
          }
        },
        true
      );

      document.addEventListener(
        "touchstart",
        function (event) {
          if (isTextInput(event.target)) {
            schedulePosition(event.target);
          } else {
            setTimeout(scheduleByScan, 80);
            setTimeout(scheduleByScan, 250);
            setTimeout(scheduleByScan, 500);
          }
        },
        true
      );

      document.addEventListener(
        "pointerdown",
        function () {
          setTimeout(scheduleByScan, 80);
          setTimeout(scheduleByScan, 250);
        },
        true
      );

      document.addEventListener(
        "focusout",
        function (event) {
          if (event.target === activeInput) {
            keyboardSessionUntil = Math.max(keyboardSessionUntil, Date.now() + 2600);

            if (clearSessionTimer) {
              clearTimeout(clearSessionTimer);
            }

            clearSessionTimer = setTimeout(function () {
              const candidate = findCandidateInput();

              if (candidate) {
                activeInput = candidate;
                schedulePosition(candidate);
                return;
              }

              resetKeyboardSessionIfClosed();
            }, 1200);
          }
        },
        true
      );

      window.addEventListener("resize", function () {
        requestAnimationFrame(updatePosition);
        setTimeout(updatePosition, 100);
        setTimeout(updatePosition, 300);
        setTimeout(scheduleByScan, 600);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () {
          requestAnimationFrame(updatePosition);
          setTimeout(scheduleByScan, 120);
          setTimeout(scheduleByScan, 420);
        });

        window.visualViewport.addEventListener("scroll", function () {
          requestAnimationFrame(updatePosition);
          setTimeout(scheduleByScan, 120);
        });
      }

      if ("virtualKeyboard" in navigator) {
        try {
          navigator.virtualKeyboard.addEventListener("geometrychange", function () {
            requestAnimationFrame(updatePosition);
            setTimeout(scheduleByScan, 120);
          });
        } catch (e) { }
      }

      const observer = new MutationObserver(function () {
        if (isApplyingStyles) return;

        if (mutationDebounceTimer) {
          clearTimeout(mutationDebounceTimer);
        }

        mutationDebounceTimer = setTimeout(function () {
          const candidate = findCandidateInput();

          if (candidate) {
            schedulePosition(candidate);
          }
        }, 40);
      });

      // Observe attributes too, but debounce and ignore our own style pass.
      // This catches Safari/PWA cases where Unity creates the native input early
      // and only later changes display/visibility/position.
      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["style", "class", "value"]
      });
    })();
  </script>
