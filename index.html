      <div id="unity-logo">

  <script>

    window.addEventListener("load", function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register(
          'ServiceWorker.js?v=12.9'
        ).then((registration) => {
          if (registration.waiting) {
            registration.waiting.postMessage('skipWaiting');
          }
        });
      }
    });

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    // Shows a temporary message banner/ribbon for a few seconds,
    // or a permanent error message on top of the canvas if type=='error'.

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? 'block' : 'none';
      }

      var div = document.createElement('div');
      div.innerHTML = msg;

      warningBanner.appendChild(div);

      if (type == 'error') {
        div.style = 'background: red; padding: 10px;';
      }
      else {
        if (type == 'warning') {
          div.style = 'background: yellow; padding: 10px;';
        }

        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    const BUILD_VERSION = "12.9";
    var buildUrl = "Build";
    var loaderUrl =
      buildUrl + "/4f104afb6ba781d55d836fab06632b92.loader.js?v=" + BUILD_VERSION;

    var config =
    {
      arguments: [],

      dataUrl:
        buildUrl + "/ac2ed7dbf32417df34866ca4174d93c1.data.unityweb?v=" + BUILD_VERSION,

      frameworkUrl:
        buildUrl + "/2cf5edb3f747a099f6621ea75729d0e6.framework.js.unityweb?v=" + BUILD_VERSION,


		codeUrl:
        buildUrl + "/ede7d9f5f2a413dc516849f3ac0fb90d.wasm.unityweb?v=" + BUILD_VERSION,


		  streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "WebGL InputField Test",
      productVersion: "12.9",
      showBanner: unityShowBanner,
    };

    // config.matchWebGLToCanvasSize = false;



    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile viewport. Keep only the meta tag here.
      // Canvas size/keyboard locking is handled by the dedicated script below.
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content';
      document.getElementsByTagName('head')[0].appendChild(meta);
    }


    loadingBar.style.display = "block";

    var script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          progressBarFull.style.width =
            100 * progress + "%";
        })

        .then((unityInstance) => {
          // Required by WebGLCredentialAutofill so JavaScript can send

          window.unityInstance = unityInstance;

          loadingBar.style.display = "none";


        })

        .catch((message) => {
          alert(message);
        });
    };

    document.body.appendChild(script);

  <script>
    (function () {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;

      const isIOS =
        /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      let lockedWidth = window.innerWidth;
      let stableCanvasHeight = getVisibleHeight();
      let keyboardHoldUntil = 0;

      function getVisibleHeight() {
        if (window.visualViewport && window.visualViewport.height > 0) {
          return Math.round(window.visualViewport.height);
        }

        return Math.round(window.innerHeight);
      }

      function isTextInputElement(el) {
        if (!el || !el.tagName) return false;

        const tag = el.tagName.toLowerCase();
        if (tag !== "input" && tag !== "textarea") return false;

        const type = (el.getAttribute("type") || "").toLowerCase();

        return !(
          type === "hidden" ||
          type === "checkbox" ||
          type === "radio" ||
          type === "file" ||
          type === "submit" ||
          type === "button"
        );
      }

      function isTextInputFocused() {
        return isTextInputElement(document.activeElement);
      }

      function looksLikeKeyboardOpen(currentHeight) {
        if (isTextInputFocused()) return true;

        if (Date.now() < keyboardHoldUntil) return true;

        // On iOS, keyboard opening mainly appears as visualViewport.height shrink.
        if (isIOS && stableCanvasHeight > 0 && currentHeight < stableCanvasHeight - 100) {
          return true;
        }

        // On Android, use the regular keyboard height estimate.
        if (!isIOS && window.visualViewport) {
          const keyboardHeight = Math.max(
            0,
            window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop
          );

          return keyboardHeight > 80;
        }

        return false;
      }

      function applyUnityHeight(height) {
        height = Math.round(height);

        document.documentElement.style.setProperty(
          "--unity-visible-height",
          height + "px"
        );

        document.documentElement.style.margin = "0";
        document.documentElement.style.padding = "0";
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = height + "px";
        document.documentElement.style.overflow = "hidden";
        document.documentElement.style.position = "fixed";
        document.documentElement.style.left = "0";
        document.documentElement.style.top = "0";

        document.body.style.margin = "0";
        document.body.style.padding = "0";
        document.body.style.width = "100%";
        document.body.style.height = height + "px";
        document.body.style.overflow = "hidden";
        document.body.style.position = "fixed";
        document.body.style.left = "0";
        document.body.style.top = "0";

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");

        if (container) {
          container.style.position = "fixed";
          container.style.left = "0";
          container.style.top = "0";
          container.style.right = "0";
          container.style.bottom = "auto";
          container.style.width = "100vw";
          container.style.height = height + "px";
          container.style.overflow = "hidden";
          container.style.transform = "translateY(0px)";
        }

        if (canvas) {
          canvas.style.width = "100vw";
          canvas.style.height = height + "px";
        }

        window.scrollTo(0, 0);
      }

      function updateUnityCanvasHeight() {
        const currentWidth = window.innerWidth;
        const currentHeight = getVisibleHeight();

        const orientationChanged = Math.abs(currentWidth - lockedWidth) > 80;

        if (orientationChanged) {
          lockedWidth = currentWidth;

          setTimeout(function () {
            stableCanvasHeight = getVisibleHeight();
            applyUnityHeight(stableCanvasHeight);
          }, 400);

          return;
        }

        if (looksLikeKeyboardOpen(currentHeight)) {
          // Important for iOS Safari/Chrome:
          // Do not allow the keyboard shrink to resize the Unity canvas.
          applyUnityHeight(stableCanvasHeight);
          return;
        }

        // Only accept the new height when the keyboard is closed.
        // If iOS reports a temporary small visualViewport after keyboard hide,
        // keep the previous good height to avoid the "stays shrunk" issue.
        if (currentHeight >= stableCanvasHeight - 40) {
          stableCanvasHeight = currentHeight;
        }

        applyUnityHeight(stableCanvasHeight);
      }

      window.addEventListener("load", function () {
        lockedWidth = window.innerWidth;
        stableCanvasHeight = getVisibleHeight();
        applyUnityHeight(stableCanvasHeight);

        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 500);
      });

      window.addEventListener("resize", function () {
        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 300);
      });

      window.addEventListener("orientationchange", function () {
        keyboardHoldUntil = 0;

        setTimeout(function () {
          lockedWidth = window.innerWidth;
          stableCanvasHeight = getVisibleHeight();
          applyUnityHeight(stableCanvasHeight);
        }, 500);
      });

      document.addEventListener("focusin", function () {
        keyboardHoldUntil = Date.now() + 1600;

        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 300);
      });

      document.addEventListener("focusout", function () {
        keyboardHoldUntil = Date.now() + 1400;

        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 300);

        // iOS often reports the smaller viewport for a short time after blur.
        // Re-check after the keyboard animation is fully finished.
        setTimeout(function () {
          keyboardHoldUntil = 0;
          updateUnityCanvasHeight();
        }, 1600);

        setTimeout(updateUnityCanvasHeight, 2200);
      });

      window.addEventListener(
        "scroll",
        function () {
          window.scrollTo(0, 0);
        },
        { passive: false }
      );

      document.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () {
          requestAnimationFrame(updateUnityCanvasHeight);
        });

        window.visualViewport.addEventListener("scroll", function () {
          requestAnimationFrame(updateUnityCanvasHeight);
          window.scrollTo(0, 0);
        });
      }

      updateUnityCanvasHeight();
    })();
  </script>
  <script>
    (function () {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;

      const userAgent = navigator.userAgent || "";

      const isIOS =
        /iPhone|iPad|iPod/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isIOSChrome = isIOS && /CriOS/i.test(userAgent);

      const isAndroid = /Android/i.test(userAgent);

      // Facebook Messenger / Facebook in-app browser on Android does not behave
      // like normal Chrome. It can report keyboard height as 0 and delay focus.
      const isAndroidFacebookInAppBrowser =
        isAndroid &&
        /FBAN|FBAV|FB_IAB|MessengerForAndroid|Orca-Android/i.test(userAgent);

      const isIPad =
        /iPad/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isIPhoneSafariLike =
        isIOS &&
        !isIPad &&
        !isIOSChrome;

      // Use the Safari/PWA transform-lift strategy only on iPad.
      // On iPhone Safari/PWA this created extra lift / flicker because the main
      // bottom-based positioning is already enough.
      const useIOSSafariTransformLift = isIPad && !isIOSChrome;

      if ("virtualKeyboard" in navigator) {
        try {
          navigator.virtualKeyboard.overlaysContent = true;
        } catch (e) { }
      }

      let activeInput = null;
      let activeOkButton = null;
      let lastOkButton = null;
      let clearSessionTimer = null;
      let positionLoopTimer = null;
      let mutationDebounceTimer = null;
      let isApplyingStyles = false;
      let layoutGeneration = 0;
      const scheduledLayoutTimers = new Set();
      const positionedInputs = new Set();
      const positionedButtons = new Set();
      const retiredInputs = new WeakSet();
      const originalInputStyles = new WeakMap();
      const originalButtonStyles = new WeakMap();

      const INPUT_BORDER_COLOR = "#39A3D0";
      const INPUT_BORDER_WIDTH = "1px";
      const INPUT_BORDER_STYLE = INPUT_BORDER_WIDTH + " solid " + INPUT_BORDER_COLOR;

      const INPUT_GAP = 8;
      const INPUT_HEIGHT = 42;
      const INPUT_LEFT = 12;
      const INPUT_RIGHT = 12;
      const OK_BUTTON_WIDTH = 64;

      // Android Chrome browser only.
      const CHROME_BROWSER_INPUT_EXTRA_LIFT = 20;
      const ANDROID_CHROME_CREDENTIAL_PREVIEW_CLEARANCE = 12;
      const ANDROID_CHROME_HANDOFF_MIN_ACTIVE_MS = 900;
      const ANDROID_CHROME_HANDOFF_MAX_ACTIVE_MS = 2000;
      const ANDROID_CHROME_HANDOFF_STABLE_MS = 250;

      // Android Facebook Messenger / Facebook in-app browser fallback.
      // Used only when visualViewport/VirtualKeyboard reports keyboard height as 0.
      const ANDROID_MESSENGER_FALLBACK_KEYBOARD_MIN = 300;
      const ANDROID_MESSENGER_FALLBACK_KEYBOARD_MAX = 450;
      const ANDROID_MESSENGER_FALLBACK_KEYBOARD_RATIO = 0.42;
      const ANDROID_MESSENGER_INPUT_EXTRA_LIFT = 35;

      // iOS Safari / installed Web App fallback. Increase ratio/extra only if Safari is still too low.
      const IOS_FALLBACK_KEYBOARD_MIN = 280;
      const IOS_FALLBACK_KEYBOARD_MAX = 420;
      const IOS_FALLBACK_KEYBOARD_RATIO = 0.42;
      const IOS_SAFARI_INPUT_LIFT_EXTRA = 0;

      // iPhone Safari / iPhone installed app can over-report the keyboard area.
      // Move only the iPhone Safari-like bottom-positioned input slightly down.
      // iPad still uses the separate Safari/PWA patch below.
      const IOS_IPHONE_SAFARI_DOWN_ADJUST = 2;

      const KEYBOARD_OPEN_THRESHOLD = 80;

      let lastKeyboardHeight = 0;
      let lockedInputBottom = 0;
      let keyboardSessionUntil = 0;
      let lastUserGestureAt = 0;
      let chromeCredentialHandoffStartedAt = 0;
      let chromeCredentialHandoffUntil = 0;
      let chromeCredentialHandoffStableSince = 0;
      let chromeCredentialHandoffLastHeight = -1;
      let chromeCredentialHandoffTimer = null;
      let chromeCredentialHandoffTarget = null;
      let chromeCredentialHandoffTargetWasFocused = false;

      function isInstalledWebApp() {
        return (
          (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
          (window.matchMedia && window.matchMedia("(display-mode: minimal-ui)").matches) ||
          window.navigator.standalone === true ||
          (document.referrer && document.referrer.indexOf("android-app://") === 0)
        );
      }

      function isNormalChromeBrowser() {
        const isAndroidChrome =
          /Android/i.test(userAgent) &&
          /Chrome\/\d+/i.test(userAgent) &&
          !/SamsungBrowser|EdgA|OPR|Firefox|FxiOS|FBAN|FBAV|FB_IAB|MessengerForAndroid|Orca-Android/i.test(userAgent);

        return isAndroidChrome && !isInstalledWebApp();
      }

      function isTextInput(el) {
        if (!el) return false;

        if (isCredentialHelper(el)) {
          const credentialForm = el.parentElement;
          if (
            !credentialForm ||
            credentialForm.getAttribute("data-unity-credential-active") !== "true" ||
            el !== document.activeElement
          ) return false;
        }

        const tag = el.tagName ? el.tagName.toLowerCase() : "";
        if (tag !== "input" && tag !== "textarea") return false;

        const type = (el.getAttribute("type") || "").toLowerCase();

        return !(
          type === "hidden" ||
          type === "checkbox" ||
          type === "radio" ||
          type === "file" ||
          type === "submit" ||
          type === "button"
        );
      }

      function isCredentialHelper(el) {
        return !!(
          el &&
          el.hasAttribute &&
          el.hasAttribute("data-unity-credential-helper")
        );
      }

      function isCredentialUsernameHelper(el) {
        return !!(
          isAndroid &&
          el &&
          el.getAttribute &&
          el.getAttribute("data-unity-credential-helper") === "username"
        );
      }

      function rememberOriginalStyle(element, snapshots, positioned) {
        if (!element || snapshots.has(element)) return;

        snapshots.set(element, {
          hadStyle: element.hasAttribute("style"),
          cssText: element.getAttribute("style") || ""
        });
        positioned.add(element);
      }

      function restoreOriginalStyle(element, snapshots, positioned) {
        if (!element || !snapshots.has(element)) return;

        const snapshot = snapshots.get(element);
        if (snapshot.hadStyle) {
          element.setAttribute("style", snapshot.cssText);
        } else {
          element.removeAttribute("style");
        }

        snapshots.delete(element);
        positioned.delete(element);
      }

      function retirePositionedInput(input) {
        if (!input) return;

        restoreOriginalStyle(input, originalInputStyles, positionedInputs);
        retiredInputs.add(input);
      }

      function restorePositionedButton(button) {
        restoreOriginalStyle(button, originalButtonStyles, positionedButtons);
      }

      function invalidateScheduledLayout() {
        layoutGeneration += 1;

        scheduledLayoutTimers.forEach(function (timer) {
          clearTimeout(timer);
        });
        scheduledLayoutTimers.clear();

        if (clearSessionTimer) {
          clearTimeout(clearSessionTimer);
          clearSessionTimer = null;
        }

        if (positionLoopTimer) {
          clearInterval(positionLoopTimer);
          positionLoopTimer = null;
        }

        if (mutationDebounceTimer) {
          clearTimeout(mutationDebounceTimer);
          mutationDebounceTimer = null;
        }

        isApplyingStyles = false;
      }

      function scheduleLayoutTimeout(callback, delay, generation) {
        const expectedGeneration = generation === undefined
          ? layoutGeneration
          : generation;
        const timer = setTimeout(function () {
          scheduledLayoutTimers.delete(timer);
          if (expectedGeneration !== layoutGeneration) return;
          callback();
        }, delay);

        scheduledLayoutTimers.add(timer);
        return timer;
      }

      function scheduleLayoutAnimationFrame(callback, generation) {
        const expectedGeneration = generation === undefined
          ? layoutGeneration
          : generation;

        requestAnimationFrame(function () {
          if (expectedGeneration !== layoutGeneration) return;
          callback();
        });
      }

      function isVisibleCandidateInput(el) {
        if (!isTextInput(el)) return false;
        if (!document.body.contains(el)) return false;
        if (retiredInputs.has(el)) return false;

        const style = window.getComputedStyle(el);
        if (style.display === "none" || style.visibility === "hidden") return false;

        return true;
      }

      function findCandidateInput() {
        // During password -> credential-username ownership transfer Chrome can
        // temporarily move DOM focus into its suggestion UI. Continue following
        // the helper that received the trusted tap instead of falling back to the
        // retiring TMP password input. Requiring one observed helper focus keeps
        // a merely dormant credential form from becoming a layout candidate.
        if (chromeCredentialHandoffTarget) {
          if (document.activeElement === chromeCredentialHandoffTarget) {
            chromeCredentialHandoffTargetWasFocused = true;
          }

          if (
            chromeCredentialHandoffTargetWasFocused &&
            document.body.contains(chromeCredentialHandoffTarget) &&
            !retiredInputs.has(chromeCredentialHandoffTarget)
          ) {
            const targetForm = chromeCredentialHandoffTarget.parentElement;
            const targetStyle = window.getComputedStyle(
              chromeCredentialHandoffTarget
            );
            if (
              targetForm &&
              targetForm.getAttribute("data-unity-credential-active") === "true" &&
              targetStyle.display !== "none" &&
              targetStyle.visibility !== "hidden"
            ) {
              return chromeCredentialHandoffTarget;
            }
          }
        }

        if (isVisibleCandidateInput(document.activeElement)) {
          return document.activeElement;
        }

        if (activeInput && isVisibleCandidateInput(activeInput)) {
          return activeInput;
        }

        const inputs = Array.from(document.querySelectorAll("input, textarea"))
          .filter(isVisibleCandidateInput);

        if (inputs.length <= 0) return null;

        // Unity usually appends/rebuilds the active native input last.
        return inputs[inputs.length - 1];
      }

      function hasTextInputSession() {
        return !!findCandidateInput() || Date.now() < keyboardSessionUntil;
      }

      function isPossibleOkButton(el) {
        if (!el) return false;

        if (el.id === "unity-webgl-credential-submit") {
          const credentialForm = el.parentElement;
          const focusedInput = document.activeElement;

          // The credential OK control belongs only to the actively focused
          // credential helper. Never reuse it for TMP/WebGLInput's native field
          // while the credential form is dormant or merely parked.
          if (
            !credentialForm ||
            credentialForm.getAttribute("data-unity-credential-active") !== "true" ||
            !focusedInput ||
            !focusedInput.getAttribute ||
            focusedInput.getAttribute("data-unity-credential-helper") !== "username"
          ) return false;
        }

        const tag = el.tagName ? el.tagName.toLowerCase() : "";
        const text = (el.innerText || el.value || el.textContent || "").trim().toLowerCase();

        if (tag === "button" && (text === "ok" || text === "done" || text === "enter")) {
          return true;
        }

        if (tag === "input") {
          const type = (el.getAttribute("type") || "").toLowerCase();

          if (
            (type === "button" || type === "submit") &&
            (text === "ok" || text === "done" || text === "enter")
          ) {
            return true;
          }
        }

        return false;
      }

      function getVisualViewportKeyboardHeight() {
        if (!window.visualViewport) return 0;

        const viewport = window.visualViewport;
        return Math.round(Math.max(
          0,
          window.innerHeight - viewport.height - viewport.offsetTop
        ));
      }

      function getRawKeyboardHeight() {
        let height = 0;

        if (!isIOS && "virtualKeyboard" in navigator && navigator.virtualKeyboard.boundingRect) {
          const rect = navigator.virtualKeyboard.boundingRect;

          if (rect && rect.height > 0) {
            height = rect.height;
          }
        }

        if (height <= 0) {
          height = getVisualViewportKeyboardHeight();
        }

        return Math.round(height);
      }

      function isChromeCredentialHandoffRecomputing() {
        return (
          isNormalChromeBrowser() &&
          chromeCredentialHandoffUntil > Date.now()
        );
      }

      function getChromeCredentialHandoffKeyboardHeight() {
        return Math.max(
          getRawKeyboardHeight(),
          getVisualViewportKeyboardHeight()
        );
      }

      function stopChromeCredentialHandoffRecompute(clearCache) {
        if (chromeCredentialHandoffTimer) {
          clearInterval(chromeCredentialHandoffTimer);
          chromeCredentialHandoffTimer = null;
        }

        chromeCredentialHandoffStartedAt = 0;
        chromeCredentialHandoffUntil = 0;
        chromeCredentialHandoffStableSince = 0;
        chromeCredentialHandoffLastHeight = -1;
        chromeCredentialHandoffTarget = null;
        chromeCredentialHandoffTargetWasFocused = false;

        if (clearCache) {
          lastKeyboardHeight = 0;
          lockedInputBottom = 0;
          keyboardSessionUntil = 0;
        }
      }

      function startChromeCredentialHandoffRecompute(targetInput) {
        if (!isNormalChromeBrowser()) return;

        stopChromeCredentialHandoffRecompute(true);

        const startedAt = Date.now();
        chromeCredentialHandoffTarget =
          targetInput && isCredentialUsernameHelper(targetInput)
            ? targetInput
            : null;
        chromeCredentialHandoffTargetWasFocused =
          chromeCredentialHandoffTarget === document.activeElement;
        chromeCredentialHandoffStartedAt = startedAt;
        chromeCredentialHandoffUntil =
          startedAt + ANDROID_CHROME_HANDOFF_MAX_ACTIVE_MS;

        // This loop is deliberately independent of the generic positioning loop:
        // credential focus cleanup invalidates that loop during both ownership
        // transfers. Recompute from the current geometry so the boundary may move
        // upward for the credential strip or downward after it disappears.
        chromeCredentialHandoffTimer = setInterval(function () {
          const now = Date.now();
          const height = getChromeCredentialHandoffKeyboardHeight();

          if (
            height > KEYBOARD_OPEN_THRESHOLD &&
            Math.abs(height - chromeCredentialHandoffLastHeight) <= 1
          ) {
            if (!chromeCredentialHandoffStableSince) {
              chromeCredentialHandoffStableSince = now;
            }

          cancelCredentialAttempt("password-handoff-timeout");
        }, 750);
      }

      function scheduleEagerPairPasswordReset(state, pairKey) {
        if (eagerPairResetTimer) clearTimeout(eagerPairResetTimer);

        const elapsed = Date.now() - state.openedAt;
        const delay = Math.max(0, EAGER_AUTOFILL_GUARD_MS - elapsed);

        eagerPairResetTimer = setTimeout(function () {
          eagerPairResetTimer = null;
          if (loginState !== state || state.passwordEventSeen) return;
          if (state.eagerPairKey !== pairKey) return;

          const usernameInput = document.getElementById(USERNAME_ID);
          const passwordInput = document.getElementById(PASSWORD_ID);
          if (!usernameInput || !passwordInput) return;

          const currentPairKey = usernameInput.value + "\u0000" + passwordInput.value;
          if (currentPairKey !== pairKey) return;

          // Keep Chrome's username suggestion and popup context, but remove the
          // silently previewed password. Confirming the same last-used account
          // will then create a real password transition instead of leaving an
          // identical pair permanently quarantined.
          passwordInput.value = "";
          state.eagerPairKey = null;
          state.lastObservedPairKey = usernameInput.value + "\u0000";
          state.lastMutationAt = Date.now();
        }, delay);
      }

      function observeCredentialValues(passwordEventSeen) {
        if (!loginState) return;

        const usernameInput = document.getElementById(USERNAME_ID);
        const passwordInput = document.getElementById(PASSWORD_ID);
        if (!usernameInput || !passwordInput) return;

        // Some Android focus transitions (notably password TMP -> credential
        // username) mutate the focused helper without delivering a usable input
        // event to this listener. Poll the actual value while it owns focus so
        // TMP always mirrors the complete username on that first helper session.
        if (isAndroidBrowser() && document.activeElement === usernameInput) {
          mirrorUsernameValueToUnity(usernameInput);
        }

        const username = usernameInput.value;
        const password = passwordInput.value;
        const pairKey = username + "\u0000" + password;
        const now = Date.now();

        if (
          passwordEventSeen &&
          password &&
          now - loginState.openedAt >= EAGER_AUTOFILL_GUARD_MS
        ) {
          loginState.passwordEventSeen = true;
        }

        if (pairKey !== loginState.lastObservedPairKey) {
          loginState.lastObservedPairKey = pairKey;
          loginState.lastMutationAt = now;

          // Chrome Desktop may preview its first suggestion by silently placing
          // values in both fields as the popup opens. Quarantine that immediate
          // pair, then clear only its password after the guard so confirming the
          // same account produces an observable transition.
          if (
            username &&
            password &&
            !loginState.passwordEventSeen &&
            !loginState.eagerPairKey &&
            now - loginState.openedAt < EAGER_AUTOFILL_GUARD_MS
          ) {
            loginState.eagerPairKey = pairKey;
            scheduleEagerPairPasswordReset(loginState, pairKey);
          }

          return;
        }

        if (!username || !password) return;
        if (now - loginState.lastMutationAt < AUTOFILL_SETTLE_MS) return;
        if (
          pairKey === loginState.eagerPairKey &&
          !loginState.passwordEventSeen
        ) return;

        const completedState = loginState;
        completedState.lastMirroredUsername = username;

        const completedForm = document.getElementById(FORM_ID);
        if (
          window.UnityNativeInputLayout &&
          typeof window.UnityNativeInputLayout.completeCredentialSession === "function"
        ) {
          window.UnityNativeInputLayout.completeCredentialSession(completedForm);
        }

        // Remove the helper before notifying Unity so it cannot steal focus or
        // keyboard events while TMP refreshes its visible fields.
        removeActiveLoginForm();

        sendCredentialToUnity(
          completedState.gameObjectName,
          completedState.callbackMethodName,
          username,
          password
        );
      }

      function setInputBounds(input, bounds, resetNativeLayout) {
        const canvas = document.getElementById("unity-canvas");
        if (!canvas || !input || !bounds) return;

        const canvasRect = canvas.getBoundingClientRect();
        const priority = resetNativeLayout ? "important" : "";

        input.style.setProperty("left", Math.round(canvasRect.left + bounds.left * canvasRect.width) + "px", priority);
        input.style.setProperty("top", Math.round(canvasRect.top + bounds.top * canvasRect.height) + "px", priority);
        input.style.setProperty("width", Math.max(1, Math.round(bounds.width * canvasRect.width)) + "px", priority);
        input.style.setProperty("height", Math.max(1, Math.round(bounds.height * canvasRect.height)) + "px", priority);

        if (!resetNativeLayout) return;

        // The mobile preview code moves the focused helper above the keyboard.
        // Reset every conflicting property when it becomes dormant or parked so
        // its next touch target is the real TMP username rectangle again.
        input.style.setProperty("position", "fixed", "important");
        input.style.setProperty("right", "auto", "important");
        input.style.setProperty("bottom", "auto", "important");
        input.style.setProperty("min-height", "0", "important");
        input.style.setProperty("margin", "0", "important");
        input.style.setProperty("padding", "0", "important");
        input.style.setProperty("border", "0", "important");
        input.style.setProperty("border-radius", "0", "important");
        input.style.setProperty("outline", "0", "important");
        input.style.setProperty("box-sizing", "border-box", "important");
        input.style.setProperty("transform", "none", "important");
        input.style.setProperty("-webkit-transform", "none", "important");
        input.style.setProperty("will-change", "auto", "important");
        input.style.setProperty("display", "block", "important");
        input.style.setProperty("visibility", "visible", "important");
      }

      function applyDesktopUsernameTextMetrics(input, state) {
        if (isAndroidBrowser() || !input || !state) return;
        if (!state.usernameBounds || !state.usernameTextBounds) return;

        const canvas = document.getElementById("unity-canvas");
        if (!canvas) return;

        const canvasRect = canvas.getBoundingClientRect();
        const outer = state.usernameBounds;
        const text = state.usernameTextBounds;
        const paddingLeft = Math.max(0, (text.left - outer.left) * canvasRect.width);
        const paddingRight = Math.max(
          0,
          (outer.left + outer.width - text.left - text.width) * canvasRect.width
        );
        const paddingTop = Math.max(0, (text.top - outer.top) * canvasRect.height);
        const paddingBottom = Math.max(
          0,
          (outer.top + outer.height - text.top - text.height) * canvasRect.height
        );
        const textHeight = Math.max(1, text.height * canvasRect.height);
        const configuredFontSize = (state.usernameFontSize || 0) * canvasRect.height;
        const fontSize = Math.max(
          16,
          configuredFontSize > 0 ? configuredFontSize : textHeight * 0.65
        );

        // TMP text stays visible; these metrics align only Chrome's transparent
        // editing layer, caret, and selection with TMP's real viewport/font.
        input.style.setProperty(
          "padding",
          paddingTop + "px " + paddingRight + "px " +
            paddingBottom + "px " + paddingLeft + "px",
          "important"
        );
        input.style.setProperty("font-size", fontSize + "px", "important");
        input.style.setProperty("line-height", textHeight + "px", "important");
        input.style.setProperty("box-sizing", "border-box", "important");
      }

      function hideCredentialSubmit(form) {
        if (!form) return;

        const submit = form.querySelector("#" + SUBMIT_ID);
        if (!submit) return;

        // Keep the credential OK accessory present for form semantics, but do
        // not paint it while the helper is dormant or parked over TMP.
        submit.style.setProperty("position", "fixed", "important");
        submit.style.setProperty("left", "-10000px", "important");
        submit.style.setProperty("right", "auto", "important");
        submit.style.setProperty("top", "0", "important");
        submit.style.setProperty("bottom", "auto", "important");
        submit.style.setProperty("width", "1px", "important");
        submit.style.setProperty("height", "1px", "important");
        submit.style.setProperty("min-height", "0", "important");
        submit.style.setProperty("z-index", "-1", "important");
        submit.style.setProperty("display", "block", "important");
        submit.style.setProperty("visibility", "hidden", "important");
        submit.style.setProperty("opacity", "0", "important");
        submit.style.setProperty("pointer-events", "none", "important");
        submit.style.setProperty("transform", "none", "important");
        submit.style.setProperty("-webkit-transform", "none", "important");
        submit.style.setProperty("background", "transparent", "important");
        submit.style.setProperty("border", "0", "important");
        submit.style.setProperty("box-shadow", "none", "important");
      }

      function releaseCredentialSubmitForActiveForm(form) {
        if (!form) return;

        const submit = form.querySelector("#" + SUBMIT_ID);
        if (!submit) return;

        // Clear dormant !important rules. The mobile native-input layout will
        // promote this semantic OK control beside the focused helper only while
        // the keyboard is open.
        submit.style.cssText =
          "position:fixed;left:-10000px;top:0;width:1px;height:1px;" +
          "margin:0;padding:0;border:0;opacity:0;pointer-events:none;";
      }

      function setCredentialFormDormant(form) {
        if (!form) return;

        const usernameInput = form.querySelector("#" + USERNAME_ID);
        const passwordInput = form.querySelector("#" + PASSWORD_ID);

        form.setAttribute("data-unity-credential-active", "false");
        form.setAttribute("data-unity-credential-preview", "dormant");

        if (
          window.UnityNativeInputLayout &&
          typeof window.UnityNativeInputLayout.releaseCredentialForm === "function"
        ) {
          window.UnityNativeInputLayout.releaseCredentialForm(form);
        }

        if (loginConfig) {
          setInputBounds(usernameInput, loginConfig.usernameBounds, true);
          setInputBounds(passwordInput, loginConfig.passwordBounds, true);

          // A touch browser can keep the original pointerover hit-test target
          // for the immediately following pointerdown. Android therefore needs
          // the dormant helper to be the real first-touch target. It remains
          // transparent and unfocused, and its typing is mirrored into TMP.

            "pointer-events",
            isAndroidBrowser() ? "auto" : "none",
            "important"
          );
          usernameInput.style.setProperty("opacity", "0.01", "important");
          usernameInput.style.setProperty("background", "transparent", "important");
          usernameInput.style.setProperty("color", "transparent", "important");
          usernameInput.style.setProperty("caret-color", "transparent", "important");
          usernameInput.style.setProperty("-webkit-text-fill-color", "transparent", "important");
        }

        if (passwordInput) {
          passwordInput.tabIndex = -1;
          passwordInput.style.setProperty("pointer-events", "none", "important");
        }

        hideCredentialSubmit(form);

        if (form.contains(document.activeElement)) {
          try {
            document.activeElement.blur();
          } catch (_) { }
        }

        // request starts from a clean pair and Chrome supplies the selected one.
        if (usernameInput) usernameInput.value = "";
        if (passwordInput) passwordInput.value = "";
      }

      function primeCredentialForm(form) {
        if (!form || loginState) return;

        const usernameInput = form.querySelector("#" + USERNAME_ID);
        form.setAttribute("data-unity-credential-active", "primed");
        form.setAttribute("data-unity-credential-preview", "dormant");

          // the helper or opens Password Manager by itself.
          usernameInput.tabIndex = -1;
          usernameInput.style.setProperty("pointer-events", "auto", "important");
        }

        hideCredentialSubmit(form);
      }

      function armCredentialForm(form) {
        if (!form) return;

        const usernameInput = form.querySelector("#" + USERNAME_ID);
        form.setAttribute("data-unity-credential-active", "true");
        form.setAttribute("data-unity-credential-preview", "active");

        if (usernameInput) {
          usernameInput.tabIndex = 0;
          usernameInput.style.setProperty("pointer-events", "auto", "important");

          if (!isAndroidBrowser()) {

            // Keep its glyphs transparent so TMP remains the visible text, but
            // expose the browser caret/selection and allow normal editing.
            usernameInput.style.setProperty("opacity", "1", "important");
            usernameInput.style.setProperty("background", "transparent", "important");
            usernameInput.style.setProperty("color", "transparent", "important");
            usernameInput.style.setProperty("-webkit-text-fill-color", "transparent", "important");
            usernameInput.style.setProperty("caret-color", "#000000", "important");
            usernameInput.style.setProperty("user-select", "text", "important");
          }
        }

        releaseCredentialSubmitForActiveForm(form);
      }

      function parkActiveLoginFormPreview() {
        if (!isAndroidBrowser() || !loginState) return;

        const form = document.getElementById(FORM_ID);
        const usernameInput = document.getElementById(USERNAME_ID);
        if (!form || !usernameInput) return;

        setInputBounds(usernameInput, loginState.usernameBounds, true);
        usernameInput.style.setProperty("opacity", "0.01", "important");
        usernameInput.style.setProperty("pointer-events", "auto", "important");
        usernameInput.style.setProperty("background", "transparent", "important");
        usernameInput.style.setProperty("color", "transparent", "important");
        usernameInput.style.setProperty("-webkit-text-fill-color", "transparent", "important");
        usernameInput.style.setProperty("caret-color", "transparent", "important");

        hideCredentialSubmit(form);
        form.setAttribute("data-unity-credential-preview", "parked");
      }

      function applyLoginFormLayout() {
        const layoutState = loginState || loginConfig;
        if (!layoutState) return;

        setInputBounds(
          document.getElementById(USERNAME_ID),
          layoutState.usernameBounds
        );

        applyDesktopUsernameTextMetrics(
          document.getElementById(USERNAME_ID),
          layoutState
        );

        setInputBounds(
          document.getElementById(PASSWORD_ID),
          layoutState.passwordBounds
        );

      }

      function configureLoginForm(options) {
        // Preload the real form while the Unity login UI is visible. Keeping it
        // connected before the first trusted tap gives Chrome time to register
        // the username/current-password pair with Password Manager.
        loginConfig = options;

        const form = ensureCredentialForm();

        if (loginState) {
          loginState.gameObjectName = options.gameObjectName;
          loginState.callbackMethodName = options.callbackMethodName;
          loginState.closedCallbackMethodName = options.closedCallbackMethodName;
          loginState.manualInputCallbackMethodName = options.manualInputCallbackMethodName;
          loginState.helperFocusCallbackMethodName = options.helperFocusCallbackMethodName;
          loginState.usernameBounds = options.usernameBounds;
          loginState.usernameTextBounds = options.usernameTextBounds;
          loginState.usernameFontSize = options.usernameFontSize;
          loginState.passwordBounds = options.passwordBounds;

          const usernameInput = document.getElementById(USERNAME_ID);
          if (usernameInput && document.activeElement !== usernameInput) {
            usernameInput.value = options.username || "";
            loginState.lastMirroredUsername = usernameInput.value;
            loginState.lastObservedPairKey = usernameInput.value + "\u0000";
            loginState.lastMutationAt = Date.now();
          }
        } else {
          setCredentialFormDormant(form);
        }

        applyLoginFormLayout();
      }

      function notifyUnityCredentialHelperFocus(state, hasFocus) {
        if (!state) return;

        if (
          !window.unityInstance ||
          !state.gameObjectName ||
          !state.helperFocusCallbackMethodName
        ) return;

        window.unityInstance.SendMessage(
          state.gameObjectName,
          state.helperFocusCallbackMethodName,
          hasFocus ? (isAndroidBrowser() ? "android:1" : "1") : "0"
        );
      }

      function isAndroidKeyboardOpen() {
        if (!isAndroidBrowser()) return true;

        const nativeLayout = window.UnityNativeInputLayout;
        if (
          nativeLayout &&
          typeof nativeLayout.isKeyboardOpen === "function"
        ) {
          return nativeLayout.isKeyboardOpen();
        }

        if (!window.visualViewport) return false;
        return (
          window.innerHeight -
          window.visualViewport.height -
          window.visualViewport.offsetTop
        ) > 80;
      }

      function focusCredentialUsername(reopenKeyboardIfNeeded) {
        const usernameInput = document.getElementById(USERNAME_ID);
        if (!usernameInput) return;

        const needsFreshFocusTransition =
          reopenKeyboardIfNeeded === true &&
          isAndroidBrowser() &&
          document.activeElement === usernameInput &&
          !isAndroidKeyboardOpen();

        credentialUsernameRefocusInProgress = needsFreshFocusTransition;
        try {
          if (needsFreshFocusTransition) usernameInput.blur();

          try {
            usernameInput.focus({ preventScroll: true });
          } catch (_) {

            needsFreshFocusTransition &&
            navigator.virtualKeyboard &&
            typeof navigator.virtualKeyboard.show === "function"

            try {
              navigator.virtualKeyboard.show();
            } catch (_) { }
          }
        } finally {
          credentialUsernameRefocusInProgress = false;
        }

      }

      function requestLoginForm(reopenKeyboardIfNeeded, deferFocusToNativeTouch) {
        if (!loginConfig) return;

        if (loginState) {

          notifyUnityCredentialHelperFocus(loginState, true);
          armCredentialForm(activeForm);
          applyLoginFormLayout();
          if (!deferFocusToNativeTouch) {

        const usernameInput = document.getElementById(USERNAME_ID);
        const passwordInput = document.getElementById(PASSWORD_ID);

        const replayActiveRequestOnFirstFocus =

          isAndroidKeyboardOpen() &&
          !!document.activeElement &&
          !form.contains(document.activeElement) &&
          isEditableTarget(document.activeElement);

        // Never seed the helper with TMP's existing password. Chrome fills this
        // from the selected account, so username-first mutations cannot be paired
        // with a stale password from the previous account.
        passwordInput.value = "";

        if (
          window.UnityNativeInputLayout &&
          typeof window.UnityNativeInputLayout.beginCredentialSession === "function"
        ) {
          window.UnityNativeInputLayout.beginCredentialSession(form);
        }

          gameObjectName: loginConfig.gameObjectName,
          callbackMethodName: loginConfig.callbackMethodName,
          closedCallbackMethodName: loginConfig.closedCallbackMethodName,
          manualInputCallbackMethodName: loginConfig.manualInputCallbackMethodName,
          helperFocusCallbackMethodName: loginConfig.helperFocusCallbackMethodName,
          usernameBounds: loginConfig.usernameBounds,
          usernameTextBounds: loginConfig.usernameTextBounds,
          usernameFontSize: loginConfig.usernameFontSize,
          passwordBounds: loginConfig.passwordBounds,
          openedAt: now,
          lastObservedPairKey: usernameInput.value + "\u0000",
          lastMutationAt: now,
          passwordEventSeen: false,
          eagerPairKey: null,
          lastMirroredUsername: loginConfig.username || "",
          credentialUiInteractionSeen: false,
          helperBlurredForCredentialUi: false,
          pageFocusWasLost: false,
          passwordTmpHandoffPending: false,

        // alive while Password Manager or its keyboard suggestions own the UI;
        // removing the focused helper closes the keyboard and strands Chrome's
        // "OK" input accessory. Mobile closes only on success or an intentional
        // interaction outside the credential helper.
        if (!isAndroidBrowser()) {

        }
      }

      function updateCredentialPointerPrime(event) {
        if (!loginConfig || loginState) return;

        const form = document.getElementById(FORM_ID);
        if (!form) return;

        if (pointerIsInsideUsername(event, loginConfig)) {
          primeCredentialForm(form);
        } else if (
          form.getAttribute("data-unity-credential-active") === "primed"
        ) {
          setCredentialFormDormant(form);
        }
      }

      function removeActiveLoginForm() {
        if (passwordTmpHandoffTimer) {
          clearTimeout(passwordTmpHandoffTimer);
          passwordTmpHandoffTimer = null;
        }

        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }

        if (attemptTimer) {
          clearTimeout(attemptTimer);
          attemptTimer = null;
        }

        if (eagerPairResetTimer) {
          clearTimeout(eagerPairResetTimer);
          eagerPairResetTimer = null;
        }

        if (credentialUiReturnTimer) {
          clearTimeout(credentialUiReturnTimer);
          credentialUiReturnTimer = null;
        }

          cancelAnimationFrame(credentialUiFrameRequest);
          credentialUiFrameRequest = null;
        }

        notifyUnityCredentialHelperFocus(completedState, false);
        loginState = null;

          completedState &&
          loginConfig &&
          typeof completedState.lastMirroredUsername === "string"
        ) {
          loginConfig.username = completedState.lastMirroredUsername;
        }

        const form = document.getElementById(FORM_ID);
        if (!form) return;

        if (loginConfig) {
          // The Unity login UI is still visible. Leave the already-discovered
          // form connected, but make it unable to intercept TMP interaction.
          setCredentialFormDormant(form);
        } else {

        }

      function removeLoginForm() {

        removeActiveLoginForm();
      }

      window.UnityCredentialAutofill = {
        configureLoginForm: configureLoginForm,
        removeLoginForm: removeLoginForm,
        requestLoginForm: requestLoginForm,
        parkActiveLoginFormPreview: parkActiveLoginFormPreview,

        saveCredentials: async function (username, password) {

            if (!window.PasswordCredential) return;
            if (!navigator.credentials || !navigator.credentials.store) return;

              name: username,
              password: password

      window.addEventListener("resize", applyLoginFormLayout);

      // only hit testing during that earlier event so the following real down

      document.addEventListener("pointermove", updateCredentialPointerPrime, true);

      document.addEventListener("focusin", function (event) {
        if (!isEditableTarget(event.target)) return;

        if (form && form.contains(event.target)) return;

          loginState &&
          isNormalAndroidChromeBrowser() &&
          loginState.passwordTmpHandoffPending

          isAndroidBrowser() &&

            event.target.blur();

          // with setTimeout loses Android's keyboard-opening user activation.

      function keepAndroidCredentialHelperOnUsername(event) {
        if (!loginConfig) return false;
        if (!isAndroidBrowser() || !pointerIsInsideUsername(event, loginConfig)) return false;

        const form = document.getElementById(FORM_ID);
        if (form && form.contains(event.target)) return false;

        if (event.cancelable) event.preventDefault();
        event.stopImmediatePropagation();
        const now = Date.now();
        const isSamePhysicalGesture =
          now - lastProtectedUsernameTouchAt < 180;

        // touchstart before the helper is active, selects TMP, and the first tap
        // is spent only switching ownership instead of opening Password Manager.
        if (!isSamePhysicalGesture) requestLoginForm(true);
        if (loginState) loginState.credentialUiInteractionSeen = true;
        return true;
      }

      document.addEventListener("touchstart", function (event) {

      }, { capture: true, passive: false });

      document.addEventListener("pointerdown", function (event) {
        if (!loginConfig) return;
        if (event.button !== undefined && event.button !== 0) return;

        if (keepAndroidCredentialHelperOnUsername(event)) return;

        if (isEditableTarget(event.target)) {
          if (form && form.contains(event.target)) {
            if (event.target.id === USERNAME_ID && isAndroidBrowser()) {
              const now = Date.now();
              const isSamePhysicalGesture =
                now - lastProtectedUsernameTouchAt < 180;
              lastProtectedUsernameTouchAt = now;

            } else if (!loginState && event.target.id === USERNAME_ID) {

            }

            if (loginState && isAndroidBrowser()) {
              loginState.credentialUiInteractionSeen = true;
            }
            return;
          } else if (loginState) {
            // Another editable (for example the password field) was selected
            // intentionally. End the username-helper session without trying to
            // transfer focus or recreate a TMP-native username element.
            if (
              isNormalAndroidChromeBrowser() &&
              pointerIsInsidePassword(event, loginConfig)
            ) {
              beginPasswordTmpHandoff();
            } else {
              removeActiveLoginForm();
            }
          }
          return;
        }

        if (loginState) {
          if (Date.now() - loginState.openedAt < 250) return;

          if (!form || !form.contains(event.target)) {
            if (
              isNormalAndroidChromeBrowser() &&
              pointerIsInsidePassword(event, loginConfig)
            ) {
              beginPasswordTmpHandoff();
            } else {
              cancelCredentialAttempt("outside-pointer");
            }
          }
          return;
        }

        if (!pointerIsInsideUsername(event, loginConfig)) return;

        requestLoginForm();
      }, true);

      // Android's Password Manager is browser/OS UI, so it exposes no dismissal
      // event to the page. Its focus round trip is the reliable signal available
      // to us. The interaction flag prevents TMP/helper startup focus churn from
      // being mistaken for a dismissed credential sheet.
      window.addEventListener("blur", markCredentialUiFocusLost);
      window.addEventListener("focus", scheduleCredentialHelperParkAfterCredentialUi);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") {
          markCredentialUiFocusLost();
        } else if (document.visibilityState === "visible") {
          scheduleCredentialHelperParkAfterCredentialUi();
        }
      });

      window.addEventListener("pagehide", removeLoginForm);

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", applyLoginFormLayout);
        window.visualViewport.addEventListener("scroll", applyLoginFormLayout);
      }
    })();
  </script>
</body>

</html>
