  <script>

    window.addEventListener("load", function () {

    // Shows a temporary message banner/ribbon for a few seconds,
    // or a permanent error message on top of the canvas if type=='error'.

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? 'block' : 'none';
      }

      var div = document.createElement('div');
      div.innerHTML = msg;

      warningBanner.appendChild(div);

      if (type == 'error') {
        div.style = 'background: red; padding: 10px;';
      }
      else {
        if (type == 'warning') {
          div.style = 'background: yellow; padding: 10px;';
        }

        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

  <script>
    (function () {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;

      const isIOS =
        /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      let lockedWidth = window.innerWidth;
      let stableCanvasHeight = getVisibleHeight();
      let keyboardHoldUntil = 0;

      function getVisibleHeight() {
        if (window.visualViewport && window.visualViewport.height > 0) {
          return Math.round(window.visualViewport.height);
        }

        return Math.round(window.innerHeight);
      }

      function isTextInputElement(el) {
        if (!el || !el.tagName) return false;

        const tag = el.tagName.toLowerCase();
        if (tag !== "input" && tag !== "textarea") return false;

        const type = (el.getAttribute("type") || "").toLowerCase();

        return !(
          type === "hidden" ||
          type === "checkbox" ||
          type === "radio" ||
          type === "file" ||
          type === "submit" ||
          type === "button"
        );
      }

      function isTextInputFocused() {
        return isTextInputElement(document.activeElement);
      }

      function looksLikeKeyboardOpen(currentHeight) {
        if (isTextInputFocused()) return true;

        if (Date.now() < keyboardHoldUntil) return true;

        // On iOS, keyboard opening mainly appears as visualViewport.height shrink.
        if (isIOS && stableCanvasHeight > 0 && currentHeight < stableCanvasHeight - 100) {
          return true;
        }

        // On Android, use the regular keyboard height estimate.
        if (!isIOS && window.visualViewport) {
          const keyboardHeight = Math.max(
            0,
            window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop
          );

          return keyboardHeight > 80;
        }

        return false;
      }

      function applyUnityHeight(height) {
        height = Math.round(height);

        document.documentElement.style.setProperty(
          "--unity-visible-height",
          height + "px"
        );

        document.documentElement.style.margin = "0";
        document.documentElement.style.padding = "0";
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = height + "px";
        document.documentElement.style.overflow = "hidden";
        document.documentElement.style.position = "fixed";
        document.documentElement.style.left = "0";
        document.documentElement.style.top = "0";

        document.body.style.margin = "0";
        document.body.style.padding = "0";
        document.body.style.width = "100%";
        document.body.style.height = height + "px";
        document.body.style.overflow = "hidden";
        document.body.style.position = "fixed";
        document.body.style.left = "0";
        document.body.style.top = "0";

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");

        if (container) {
          container.style.position = "fixed";
          container.style.left = "0";
          container.style.top = "0";
          container.style.right = "0";
          container.style.bottom = "auto";
          container.style.width = "100vw";
          container.style.height = height + "px";
          container.style.overflow = "hidden";
          container.style.transform = "translateY(0px)";
        }

        if (canvas) {
          canvas.style.width = "100vw";
          canvas.style.height = height + "px";
        }

        window.scrollTo(0, 0);
      }

      function updateUnityCanvasHeight() {
        const currentWidth = window.innerWidth;
        const currentHeight = getVisibleHeight();

        const orientationChanged = Math.abs(currentWidth - lockedWidth) > 80;

        if (orientationChanged) {
          lockedWidth = currentWidth;

          setTimeout(function () {
            stableCanvasHeight = getVisibleHeight();
            applyUnityHeight(stableCanvasHeight);
          }, 400);

          return;
        }

        if (looksLikeKeyboardOpen(currentHeight)) {
          // Important for iOS Safari/Chrome:
          // Do not allow the keyboard shrink to resize the Unity canvas.
          applyUnityHeight(stableCanvasHeight);
          return;
        }

        // Only accept the new height when the keyboard is closed.
        // If iOS reports a temporary small visualViewport after keyboard hide,
        // keep the previous good height to avoid the "stays shrunk" issue.
        if (currentHeight >= stableCanvasHeight - 40) {
          stableCanvasHeight = currentHeight;
        }

        applyUnityHeight(stableCanvasHeight);
      }

      window.addEventListener("load", function () {
        lockedWidth = window.innerWidth;
        stableCanvasHeight = getVisibleHeight();
        applyUnityHeight(stableCanvasHeight);

        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 500);
      });

      window.addEventListener("resize", function () {
        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 300);
      });

      window.addEventListener("orientationchange", function () {
        keyboardHoldUntil = 0;

        setTimeout(function () {
          lockedWidth = window.innerWidth;
          stableCanvasHeight = getVisibleHeight();
          applyUnityHeight(stableCanvasHeight);
        }, 500);
      });

      document.addEventListener("focusin", function () {
        keyboardHoldUntil = Date.now() + 1600;

        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 100);
        setTimeout(updateUnityCanvasHeight, 300);
      });

      document.addEventListener("focusout", function () {
        keyboardHoldUntil = Date.now() + 1400;

        requestAnimationFrame(updateUnityCanvasHeight);
        setTimeout(updateUnityCanvasHeight, 300);

        // iOS often reports the smaller viewport for a short time after blur.
        // Re-check after the keyboard animation is fully finished.
        setTimeout(function () {
          keyboardHoldUntil = 0;
          updateUnityCanvasHeight();
        }, 1600);

        setTimeout(updateUnityCanvasHeight, 2200);
      });

      window.addEventListener(
        "scroll",
        function () {
          window.scrollTo(0, 0);
        },
        { passive: false }
      );

      document.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () {
          requestAnimationFrame(updateUnityCanvasHeight);
        });

        window.visualViewport.addEventListener("scroll", function () {
          requestAnimationFrame(updateUnityCanvasHeight);
          window.scrollTo(0, 0);
        });
      }

      updateUnityCanvasHeight();
    })();
  </script>
  <script>
    (function () {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile) return;

      const userAgent = navigator.userAgent || "";

      const isIOS =
        /iPhone|iPad|iPod/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isIOSChrome = isIOS && /CriOS/i.test(userAgent);

      const isAndroid = /Android/i.test(userAgent);

      // Facebook Messenger / Facebook in-app browser on Android does not behave
      // like normal Chrome. It can report keyboard height as 0 and delay focus.
      const isAndroidFacebookInAppBrowser =
        isAndroid &&
        /FBAN|FBAV|FB_IAB|MessengerForAndroid|Orca-Android/i.test(userAgent);

      const isIPad =
        /iPad/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isIPhoneSafariLike =
        isIOS &&
        !isIPad &&
        !isIOSChrome;

      // Use the Safari/PWA transform-lift strategy only on iPad.
      // On iPhone Safari/PWA this created extra lift / flicker because the main
      // bottom-based positioning is already enough.
      const useIOSSafariTransformLift = isIPad && !isIOSChrome;

      if ("virtualKeyboard" in navigator) {
        try {
          navigator.virtualKeyboard.overlaysContent = true;
        } catch (e) { }
      }

      let activeInput = null;
      let activeOkButton = null;
      let lastOkButton = null;
      let clearSessionTimer = null;
      let positionLoopTimer = null;
      let mutationDebounceTimer = null;
      let isApplyingStyles = false;

      const INPUT_BORDER_COLOR = "#39A3D0";
      const INPUT_BORDER_WIDTH = "1px";
      const INPUT_BORDER_STYLE = INPUT_BORDER_WIDTH + " solid " + INPUT_BORDER_COLOR;

      const INPUT_GAP = 8;
      const INPUT_HEIGHT = 42;
      const INPUT_LEFT = 12;
      const INPUT_RIGHT = 12;
      const OK_BUTTON_WIDTH = 64;

      // Android Chrome browser only.
      const CHROME_BROWSER_INPUT_EXTRA_LIFT = 20;

      // Android Facebook Messenger / Facebook in-app browser fallback.
      // Used only when visualViewport/VirtualKeyboard reports keyboard height as 0.
      const ANDROID_MESSENGER_FALLBACK_KEYBOARD_MIN = 300;
      const ANDROID_MESSENGER_FALLBACK_KEYBOARD_MAX = 450;
      const ANDROID_MESSENGER_FALLBACK_KEYBOARD_RATIO = 0.42;
      const ANDROID_MESSENGER_INPUT_EXTRA_LIFT = 35;

      // iOS Safari / installed Web App fallback. Increase ratio/extra only if Safari is still too low.
      const IOS_FALLBACK_KEYBOARD_MIN = 280;
      const IOS_FALLBACK_KEYBOARD_MAX = 420;
      const IOS_FALLBACK_KEYBOARD_RATIO = 0.42;
      const IOS_SAFARI_INPUT_LIFT_EXTRA = 0;

      // iPhone Safari / iPhone installed app can over-report the keyboard area.
      // Move only the iPhone Safari-like bottom-positioned input slightly down.
      // iPad still uses the separate Safari/PWA patch below.
      const IOS_IPHONE_SAFARI_DOWN_ADJUST = 2;

      const KEYBOARD_OPEN_THRESHOLD = 80;

      let lastKeyboardHeight = 0;
      let lockedInputBottom = 0;
      let keyboardSessionUntil = 0;
      let lastUserGestureAt = 0;

      function isInstalledWebApp() {
        return (
          (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
          (window.matchMedia && window.matchMedia("(display-mode: minimal-ui)").matches) ||
          window.navigator.standalone === true ||
          (document.referrer && document.referrer.indexOf("android-app://") === 0)
        );
      }

      function isNormalChromeBrowser() {
        const isAndroidChrome =
          /Android/i.test(userAgent) &&
          /Chrome\/\d+/i.test(userAgent) &&
          !/SamsungBrowser|EdgA|OPR|Firefox|FxiOS|FBAN|FBAV|FB_IAB|MessengerForAndroid|Orca-Android/i.test(userAgent);

        return isAndroidChrome && !isInstalledWebApp();
      }

      function isTextInput(el) {
        if (!el) return false;
        if (
          el.hasAttribute &&
          el.hasAttribute("data-unity-credential-helper") &&
          el !== document.activeElement
        ) return false;

        const tag = el.tagName ? el.tagName.toLowerCase() : "";
        if (tag !== "input" && tag !== "textarea") return false;

        const type = (el.getAttribute("type") || "").toLowerCase();

        return !(
          type === "hidden" ||
          type === "checkbox" ||
          type === "radio" ||
          type === "file" ||
          type === "submit" ||
          type === "button"
        );
      }

      function isVisibleCandidateInput(el) {
        if (!isTextInput(el)) return false;
        if (!document.body.contains(el)) return false;

        const style = window.getComputedStyle(el);
        if (style.display === "none" || style.visibility === "hidden") return false;

        return true;
      }

      function findCandidateInput() {
        if (isVisibleCandidateInput(document.activeElement)) {
          return document.activeElement;
        }

        if (activeInput && isVisibleCandidateInput(activeInput)) {
          return activeInput;
        }

        const inputs = Array.from(document.querySelectorAll("input, textarea"))
          .filter(isVisibleCandidateInput);

        if (inputs.length <= 0) return null;

        // Unity usually appends/rebuilds the active native input last.
        return inputs[inputs.length - 1];
      }

      function hasTextInputSession() {
        return !!findCandidateInput() || Date.now() < keyboardSessionUntil;
      }

      function isPossibleOkButton(el) {
        if (!el) return false;

        const tag = el.tagName ? el.tagName.toLowerCase() : "";
        const text = (el.innerText || el.value || el.textContent || "").trim().toLowerCase();

        if (tag === "button" && (text === "ok" || text === "done" || text === "enter")) {
          return true;
        }

        if (tag === "input") {
          const type = (el.getAttribute("type") || "").toLowerCase();

          if (
            (type === "button" || type === "submit") &&
            (text === "ok" || text === "done" || text === "enter")
          ) {
            return true;
          }
        }

        return false;
      }

      function getRawKeyboardHeight() {
        let height = 0;

        if (!isIOS && "virtualKeyboard" in navigator && navigator.virtualKeyboard.boundingRect) {
          const rect = navigator.virtualKeyboard.boundingRect;

          if (rect && rect.height > 0) {
            height = rect.height;
          }
        }

        if (height <= 0 && window.visualViewport) {
          const viewport = window.visualViewport;

          height = Math.max(
            0,
            window.innerHeight - viewport.height - viewport.offsetTop
          );
        }

        return Math.round(height);
      }

      function getCSSUnityHeight() {
        const raw = window.getComputedStyle(document.documentElement)
          .getPropertyValue("--unity-visible-height");

        const parsed = parseFloat(raw);

        if (parsed && parsed > 0) return parsed;

        return 0;
      }

      function getIOSFallbackKeyboardHeight() {
        const baseHeight = Math.round(
          Math.max(
            getCSSUnityHeight(),
            window.innerHeight || 0,
            document.documentElement.clientHeight || 0,
            window.visualViewport ? window.visualViewport.height : 0
          )
        );

        const estimated = Math.round(baseHeight * IOS_FALLBACK_KEYBOARD_RATIO);

        return Math.max(
          IOS_FALLBACK_KEYBOARD_MIN,
          Math.min(IOS_FALLBACK_KEYBOARD_MAX, estimated)
        );
      }

      function getAndroidMessengerFallbackKeyboardHeight() {
        const baseHeight = Math.round(
          Math.max(
            getCSSUnityHeight(),
            window.innerHeight || 0,
            document.documentElement.clientHeight || 0,
            window.visualViewport ? window.visualViewport.height : 0
          )
        );

        const estimated = Math.round(baseHeight * ANDROID_MESSENGER_FALLBACK_KEYBOARD_RATIO);

        return Math.max(
          ANDROID_MESSENGER_FALLBACK_KEYBOARD_MIN,
          Math.min(ANDROID_MESSENGER_FALLBACK_KEYBOARD_MAX, estimated)
        );
      }

      function getEffectiveKeyboardHeight() {
        let keyboardHeight = getRawKeyboardHeight();

        const candidateInput = findCandidateInput();

        if (candidateInput) {
          activeInput = candidateInput;
          keyboardSessionUntil = Math.max(keyboardSessionUntil, Date.now() + 3000);
        }

        // iOS Safari / installed PWA can report 0 while keyboard is visible.
        if (isIOS && hasTextInputSession() && keyboardHeight <= KEYBOARD_OPEN_THRESHOLD) {
          keyboardHeight = getIOSFallbackKeyboardHeight();
        }

        // Android Facebook Messenger / Facebook in-app browser can also report 0.
        if (
          isAndroidFacebookInAppBrowser &&
          hasTextInputSession() &&
          keyboardHeight <= KEYBOARD_OPEN_THRESHOLD
        ) {
          keyboardHeight = getAndroidMessengerFallbackKeyboardHeight();
        }

        if (keyboardHeight > KEYBOARD_OPEN_THRESHOLD) {
          lastKeyboardHeight = Math.max(lastKeyboardHeight, keyboardHeight);
        }

        return keyboardHeight;
      }

      function getStableInputBottom() {
        const keyboardHeight = getEffectiveKeyboardHeight();

        const extraLift = isAndroidFacebookInAppBrowser
          ? ANDROID_MESSENGER_INPUT_EXTRA_LIFT
          : (!isIOS && isNormalChromeBrowser()
            ? CHROME_BROWSER_INPUT_EXTRA_LIFT
            : 0);

        const iPhoneSafariDownAdjust = isIPhoneSafariLike
          ? IOS_IPHONE_SAFARI_DOWN_ADJUST
          : 0;

        const candidateBottom = Math.max(
          INPUT_GAP,
          keyboardHeight + INPUT_GAP + extraLift - iPhoneSafariDownAdjust
        );

        const keyboardLooksOpen =
          keyboardHeight > KEYBOARD_OPEN_THRESHOLD ||
          lastKeyboardHeight > KEYBOARD_OPEN_THRESHOLD ||
          hasTextInputSession();

        if (keyboardLooksOpen) {
          if (isIPhoneSafariLike) {
            // Do not keep the maximum old bottom value on iPhone Safari/PWA.
            // Safari can briefly over-report the keyboard area, which causes
            // the input to stay too high with a large gap.
            lockedInputBottom = candidateBottom;
            return candidateBottom;
          }

          lockedInputBottom = Math.max(
            lockedInputBottom,
            candidateBottom,
            Math.max(
              INPUT_GAP,
              lastKeyboardHeight + INPUT_GAP + extraLift - iPhoneSafariDownAdjust
            )
          );

          return lockedInputBottom;
        }

        return candidateBottom;
      }

      function getIOSSafariTransformLift() {
        const keyboardHeight = getEffectiveKeyboardHeight();

        const candidateLift = Math.max(
          INPUT_GAP,
          keyboardHeight + INPUT_GAP + IOS_SAFARI_INPUT_LIFT_EXTRA
        );

        const keyboardLooksOpen =
          keyboardHeight > KEYBOARD_OPEN_THRESHOLD ||
          lastKeyboardHeight > KEYBOARD_OPEN_THRESHOLD ||
          hasTextInputSession();

        if (keyboardLooksOpen) {
          lockedInputBottom = Math.max(
            lockedInputBottom,
            candidateLift,
            lastKeyboardHeight + INPUT_GAP + IOS_SAFARI_INPUT_LIFT_EXTRA
          );

          return lockedInputBottom;
        }

        return candidateLift;
      }

      function resetKeyboardSessionIfClosed() {
        const rawKeyboardHeight = getRawKeyboardHeight();

        if (!findCandidateInput() && rawKeyboardHeight <= KEYBOARD_OPEN_THRESHOLD) {
          lastKeyboardHeight = 0;
          lockedInputBottom = 0;
          activeInput = null;
          activeOkButton = null;
          keyboardSessionUntil = 0;
        }
      }

      function findUnityOkButton(input) {
        if (!input) return null;

        const parent = input.parentElement;

        if (parent) {
          const nearby = parent.querySelectorAll("button, input[type='button'], input[type='submit']");

          for (const el of nearby) {
            if (isPossibleOkButton(el)) {
              lastOkButton = el;
              return el;
            }
          }
        }

        const allButtons = document.querySelectorAll("button, input[type='button'], input[type='submit']");

        for (const el of allButtons) {
          if (isPossibleOkButton(el)) {
            lastOkButton = el;
            return el;
          }
        }

        if (lastOkButton && document.body.contains(lastOkButton)) {
          return lastOkButton;
        }

        const inputRect = input.getBoundingClientRect();
        let bestButton = null;
        let bestDistance = Infinity;

        allButtons.forEach(function (btn) {
          if (!document.body.contains(btn)) return;

          const rect = btn.getBoundingClientRect();

          const distance =
            Math.abs(rect.top - inputRect.top) +
            Math.abs(rect.left - inputRect.right);

          if (distance < bestDistance) {
            bestDistance = distance;
            bestButton = btn;
          }
        });

        if (bestButton) {
          lastOkButton = bestButton;
        }

        return bestButton;
      }

      function applyInputStyle(input, okWidth, bottom, lift) {
        const transformValue = lift > 0
          ? "translate3d(0, -" + lift + "px, 0)"
          : "none";

        input.style.setProperty("position", "fixed", "important");
        input.style.setProperty("left", INPUT_LEFT + "px", "important");
        input.style.setProperty("right", (INPUT_RIGHT + okWidth) + "px", "important");
        input.style.setProperty("bottom", bottom + "px", "important");
        input.style.setProperty("top", "auto", "important");

        input.style.setProperty(
          "width",
          "calc(100vw - " + (INPUT_LEFT + INPUT_RIGHT + okWidth) + "px)",
          "important"
        );

        input.style.setProperty("height", INPUT_HEIGHT + "px", "important");
        input.style.setProperty("min-height", INPUT_HEIGHT + "px", "important");

        input.style.setProperty("z-index", "2147483646", "important");
        input.style.setProperty("display", "block", "important");
        input.style.setProperty("visibility", "visible", "important");
        input.style.setProperty("opacity", "1", "important");

        input.style.setProperty("font-size", "16px", "important");

          callbackMethodName,
          payload
        );

        return true;
      }

      function cancelCredentialAttempt(reason) {
        if (!loginState) return;

        const cancelledState = loginState;
        removeLoginForm();

        if (
          window.unityInstance &&
          cancelledState.gameObjectName &&
          cancelledState.closedCallbackMethodName
        ) {
          window.unityInstance.SendMessage(
            cancelledState.gameObjectName,
            cancelledState.closedCallbackMethodName,
            reason || "dismissed"
          );
        }
      }

      function tryCompleteCredentialAttempt(valueEventSeen) {
        if (!loginState) return;

        const usernameInput = document.getElementById(USERNAME_ID);
        const passwordInput = document.getElementById(PASSWORD_ID);
        if (!usernameInput || !passwordInput) return;

        const username = usernameInput.value;
        const password = passwordInput.value;
        const valuesChanged =
          username !== loginState.initialUsername ||
          password !== loginState.initialPassword;

        // A saved-password selection fills the password field. Input/change
        // events cover normal Chrome autofill; the value comparison covers
        // Chrome paths that mutate the controls without dispatching events.
        if (!username || !password || (!valueEventSeen && !valuesChanged)) return;

        const completedState = loginState;

        // Remove the helper before notifying Unity so it cannot steal focus or
        // keyboard events while TMP refreshes its visible fields.
        removeLoginForm();

        sendCredentialToUnity(
          completedState.gameObjectName,
          completedState.callbackMethodName,
          username,
          password
        );
      }

      function setInputBounds(input, bounds) {
        const canvas = document.getElementById("unity-canvas");
        if (!canvas || !bounds) return;

        const canvasRect = canvas.getBoundingClientRect();
        input.style.left = Math.round(canvasRect.left + bounds.left * canvasRect.width) + "px";
        input.style.top = Math.round(canvasRect.top + bounds.top * canvasRect.height) + "px";
        input.style.width = Math.max(1, Math.round(bounds.width * canvasRect.width)) + "px";
        input.style.height = Math.max(1, Math.round(bounds.height * canvasRect.height)) + "px";
      }

      function applyLoginFormLayout() {
        if (!loginState) return;

        setInputBounds(
          document.getElementById(USERNAME_ID),
          loginState.usernameBounds
        );

        setInputBounds(
          document.getElementById(PASSWORD_ID),
          loginState.passwordBounds
        );
      }

      function configureLoginForm(options) {
        // Each username selection is a new, one-shot browser credential attempt.
        removeLoginForm();

        const form = ensureCredentialForm();
        const usernameInput = document.getElementById(USERNAME_ID);
        const passwordInput = document.getElementById(PASSWORD_ID);

        loginState = {
          gameObjectName: options.gameObjectName,
          callbackMethodName: options.callbackMethodName,
          closedCallbackMethodName: options.closedCallbackMethodName,
          usernameBounds: options.usernameBounds,
          passwordBounds: options.passwordBounds,
          initialUsername: options.username || "",
          initialPassword: options.password || "",
          openedAt: Date.now(),
          focusCount: 0
        };

        usernameInput.value = loginState.initialUsername;
        passwordInput.value = loginState.initialPassword;

        form.style.display = "block";
        applyLoginFormLayout();

        // Chrome does not consistently dispatch input/change events for every
        // autofill path, so also observe values while this attempt is active.
        pollTimer = setInterval(function () {
          tryCompleteCredentialAttempt(false);
        }, 100);

        // Browsers do not expose whether their password sheet has no entries or
        // was dismissed. This bounded fallback guarantees that the helper cannot
        // remain in the DOM and interfere with normal TMP editing.
        attemptTimer = setTimeout(function () {
          cancelCredentialAttempt("timeout");
        }, CREDENTIAL_ATTEMPT_TIMEOUT_MS);

        // ConfigureLoginForm is invoked from TMP's username selection. Focus and
        // click the newly-created real input while that interaction is active so
        // Chrome can open its native saved-password UI.
        try {
          usernameInput.focus({ preventScroll: true });
        } catch (_) {
          usernameInput.focus();
        }
        usernameInput.click();
      }

      function removeLoginForm() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }

        if (attemptTimer) {
          clearTimeout(attemptTimer);
          attemptTimer = null;
        }

        loginState = null;

        const form = document.getElementById(FORM_ID);
        if (form) form.remove();
      }

      window.UnityCredentialAutofill = {
        configureLoginForm: configureLoginForm,
        removeLoginForm: removeLoginForm,

        saveCredentials: async function (username, password) {
          username = (username || "").trim();
          password = password || "";

          if (!username || !password) return;

          try {
            // No iOS overlay fallback. If unsupported, do nothing.
            if (!window.PasswordCredential) return;
            if (!navigator.credentials || !navigator.credentials.store) return;

            const credential = new PasswordCredential({
              id: username,
              name: username,
              password: password
            });

            await navigator.credentials.store(credential);
          } catch (e) {
            console.warn("Credential store failed:", e);
          }
        }
      };

      window.addEventListener("resize", applyLoginFormLayout);

      // Clicking anywhere other than the temporary credential controls dismisses
      // the current attempt. The opening pointer event is ignored because the
      // form is created while Unity is processing that same selection.
      document.addEventListener("pointerdown", function (event) {
        if (!loginState || Date.now() - loginState.openedAt < 250) return;

        const form = document.getElementById(FORM_ID);
        if (!form || !form.contains(event.target)) {
          cancelCredentialAttempt("outside-pointer");
        }
      }, true);

      document.addEventListener("keydown", function (event) {
        if (loginState && event.key === "Escape") {
          cancelCredentialAttempt("escape");
        }
      }, true);

      window.addEventListener("pagehide", removeLoginForm);

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", applyLoginFormLayout);
        window.visualViewport.addEventListener("scroll", applyLoginFormLayout);
      }
    })();
  </script>

</body>

</html>
